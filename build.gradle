plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Meteor Releases'
		url = 'https://maven.meteordev.org/releases'
	}
	maven {
		name = 'Meteor Snapshots'
		url = 'https://maven.meteordev.org/snapshots'
	}
	maven {
		name = 'OpenCollab Snapshots'
		url = 'https://repo.opencollab.dev/maven-snapshots/'
	}
	maven {
		name = 'OpenCollab Releases'
		url = 'https://repo.opencollab.dev/main/'
	}
}

sourceSets {
	stressClient {
		java.srcDir 'src/stressClient/java'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"aoptools" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
	stressClientImplementation 'org.geysermc.mcprotocollib:protocol:1.21.11-SNAPSHOT'
	stressClientImplementation 'org.slf4j:slf4j-simple:2.0.17'
}

def stressClientJar = tasks.register('stressClientJar', Jar) {
	group = 'build'
	description = 'Builds the local-only, rate-limited Minecraft stress-test client.'
	archiveFileName = 'aop-stress-client.jar'
	destinationDirectory = layout.buildDirectory.dir('stress-client')
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	manifest {
		attributes 'Main-Class': 'hu.pelyh.aoptools.stress.LocalStressBotRunner'
	}
	from sourceSets.stressClient.output
	from {
		configurations.stressClientRuntimeClasspath.collect { dependency ->
			dependency.isDirectory() ? dependency : zipTree(dependency)
		}
	}
	exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}

processResources {
	dependsOn stressClientJar
	def modVersion = project.version
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
	from(stressClientJar.flatMap { it.archiveFile }) {
		into 'aoptools'
		rename { 'aop-stress-client.jar' }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def archiveName = base.archivesName.get()
	inputs.property "archiveName", archiveName
	from("LICENSE") {
		rename { "${it}_${archiveName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

def appDataDir = System.getenv('APPDATA')
def huncutModsDir = appDataDir != null
		? new File((String) appDataDir, 'PrismLauncher/instances/huncut/.minecraft/mods')
		: layout.buildDirectory.dir('unused-huncut-mods').get().asFile

tasks.register('deployToHuncut', Copy) {
	group = 'distribution'
	description = 'Builds and installs the addon into the Prism Launcher huncut instance.'
	dependsOn tasks.named('remapJar')
	from tasks.named('remapJar').flatMap { it.archiveFile }
	into huncutModsDir

	doFirst {
		huncutModsDir.mkdirs()
		def previousJars = huncutModsDir.listFiles({ File dir, String name ->
			name.startsWith('aop-tools-') && name.endsWith('.jar')
		} as FilenameFilter)
		previousJars?.each { it.delete() }
	}
}
