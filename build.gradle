import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.StandardCopyOption
import java.util.zip.ZipFile

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Meteor Releases'
		url = 'https://maven.meteordev.org/releases'
	}
	maven {
		name = 'Meteor Snapshots'
		url = 'https://maven.meteordev.org/snapshots'
	}
	maven {
		name = 'OpenCollab Snapshots'
		url = 'https://repo.opencollab.dev/maven-snapshots/'
	}
	maven {
		name = 'OpenCollab Releases'
		url = 'https://repo.opencollab.dev/main/'
	}
}

sourceSets {
	main.java.srcDir 'src/shared/java'
	stressClient {
		java.srcDir 'src/stressClient/java'
		java.srcDir 'src/shared/java'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"aoptools" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
	stressClientImplementation 'org.geysermc.mcprotocollib:protocol:1.21.11-SNAPSHOT'
	stressClientImplementation 'org.slf4j:slf4j-simple:2.0.17'
}

def stressClientJar = tasks.register('stressClientJar', Jar) {
	group = 'build'
	description = 'Builds the local-only, rate-limited Minecraft stress-test client.'
	archiveFileName = 'aop-stress-client.jar'
	destinationDirectory = layout.buildDirectory.dir('stress-client')
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	manifest {
		attributes 'Main-Class': 'hu.pelyh.aoptools.stress.LocalStressBotRunner'
	}
	from sourceSets.stressClient.output
	from {
		configurations.stressClientRuntimeClasspath.collect { dependency ->
			dependency.isDirectory() ? dependency : zipTree(dependency)
		}
	}
	exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}

processResources {
	dependsOn stressClientJar
	def modVersion = project.version
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
	from(stressClientJar.flatMap { it.archiveFile }) {
		into 'aoptools'
		rename { 'aop-stress-client.jar' }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

def checkStressServerPolicy = tasks.register('checkStressServerPolicy', JavaExec) {
	group = 'verification'
	description = 'Checks local endpoint restrictions without opening network connections.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'hu.pelyh.aoptools.StressServerPolicyCheck'
}
tasks.named('check') { dependsOn checkStressServerPolicy }
tasks.named('test', Test) {
	// Verification sources are executable checks rather than JUnit tests.
	failOnNoDiscoveredTests = false
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def archiveName = base.archivesName.get()
	inputs.property "archiveName", archiveName
	from("LICENSE") {
		rename { "${it}_${archiveName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

tasks.register('prismPack', Zip) {
	group = 'distribution'
	description = 'Packages the public download manifest and installation notes.'
	archiveFileName = "aop-tools-huncut-optimized-${project.version}.mrpack"
	destinationDirectory = layout.buildDirectory.dir('distributions')
	from('pack') {
		include 'modrinth.index.json', 'overrides/HUNCUT-README.txt'
	}
}

def appDataDir = providers.environmentVariable('APPDATA').orElse('').get()
def addonJar = tasks.named('remapJar').flatMap { it.archiveFile }
tasks.register('deployToHuncut') {
	group = 'distribution'
	description = 'Builds and installs the addon into the Prism Launcher huncut instance.'
	inputs.file(addonJar)
	doLast {
		def instance = new File(appDataDir, 'PrismLauncher/instances/huncut')
		if (!appDataDir || !new File(instance, 'instance.cfg').isFile()) {
			throw new GradleException('Prism instance huncut was not found.')
		}
		def mods = Files.createDirectories(instance.toPath().resolve('.minecraft/mods'))
		def source = addonJar.get().asFile.toPath()
		def target = mods.resolve(source.fileName)
		def old = []
		Files.newDirectoryStream(mods, 'aop-tools-*.jar').withCloseable { files ->
			for (def path : files) {
				if (!Files.isRegularFile(path, LinkOption.NOFOLLOW_LINKS)) continue
				try {
					new ZipFile(path.toFile()).withCloseable { zip ->
						def metadata = zip.getEntry('fabric.mod.json')
						if (metadata && zip.getInputStream(metadata).withCloseable { new JsonSlurper().parse(it).id == 'aoptools' }) {
							old.add(path)
						}
					}
				} catch (java.util.zip.ZipException ignored) {
					// Leave unrelated or unreadable archives untouched.
				}
			}
		}
		if (Files.exists(target, LinkOption.NOFOLLOW_LINKS) && !old.contains(target)) {
			throw new GradleException("A different file already occupies ${target}.")
		}
		if (old.size() == 1 && old[0] == target && Files.mismatch(source, target) == -1L) return
		def staging = Files.createTempDirectory(mods, '.aop-update-')
		def staged = staging.resolve('incoming.tmp')
		def backups = [:]
		try {
			Files.copy(source, staged)
			for (def path : old) {
				def backup = staging.resolve(path.fileName.toString() + '.bak')
				Files.move(path, backup)
				backups[path] = backup
			}
			Files.move(staged, target, StandardCopyOption.ATOMIC_MOVE)
		} catch (IOException failure) {
			backups.each { original, backup ->
				try { Files.move(backup, original) }
				catch (IOException rollbackFailure) { failure.addSuppressed(rollbackFailure) }
			}
			throw new GradleException("Could not install AOP Tools. Close Minecraft and retry. Any unrestored backups are in ${staging}.", failure)
		} finally {
			Files.deleteIfExists(staged)
			boolean empty = Files.newDirectoryStream(staging).withCloseable { !it.iterator().hasNext() }
			if (empty) Files.deleteIfExists(staging)
		}
		backups.values().each { Files.deleteIfExists(it) }
		Files.deleteIfExists(staging)
	}
}
